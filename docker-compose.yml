services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: raglab
    ports:
      - "5432:5432"
    volumes:
      - raglab-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d raglab"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      RAGLAB_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/raglab
      RAGLAB_DATABASE_ENABLED: "true"
      RAGLAB_UPLOAD_DIR: /data/uploads
      RAGLAB_CUSTOM_PLUGIN_DIR: /data/plugins
      RAGLAB_CORS_ORIGINS: http://localhost:6650,http://127.0.0.1:6650
    ports:
      - "6660:8000"
    volumes:
      - raglab-uploads:/data/uploads
      - raglab-plugins:/data/plugins
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    ports:
      - "6650:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  raglab-pg:
  raglab-uploads:
  raglab-plugins:
